    <title>Final Project Game UI</title>
    <!--This game interface is a simple click to pick, the pixelated media gives the intent of the artistic style and the theme revolving around space and

    <article id="menu">

            <h3 id="title1">Doors</h3>
            <video width="200" height="112" autoplay muted loop>
                <source src="./media/Screen Recording 2026-04-20 232336.mp4" type="video/mp4">
            
                Your browser does not support the video tag.
            </video>
            <p id="detail1">Pick a door, if you are lucky you may win big.</p>
            </a>
            <a class="btn" href="./DoorsReadMe.txt">More Info</a>
        </section>
        
        <section id="JS">
            <a id="dodgerLink" href="./Dodger.html">
            <h3 id="title2">Dodger</h3>
        <video width="100" height="112" autoplay muted loop>
            <source src="./media/DodgerVid.mp4" type="video/mp4">
